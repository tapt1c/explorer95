name: Win32 build
on:
  # Feature branches are checked through their PR; tags use release.yml.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      group:
        description: Smoke group (full for a complete regression run)
        type: choice
        default: full
        options: [full, core, menu, browser]

permissions:
  contents: read
  actions: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
      layout: ${{ steps.select.outputs.layout }}
      group: ${{ steps.select.outputs.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check routing rules
        run: python3 -m unittest discover -s tests -p test_select_checks.py
      - name: Find the last successfully checked main commit
        if: github.event_name == 'push'
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'build.yml', branch: 'main', status: 'success', per_page: 100
              });
              // Manual subset runs are not a baseline for automatic CI.
              const run = data.workflow_runs.find(run =>
                run.event === 'push' && run.head_sha !== context.sha);
              core.setOutput('base', run ? run.head_sha : '');
            } catch (error) {
              core.warning('Cannot find a verified baseline; selecting the full suite.');
              core.setOutput('base', '');
            }
      - name: Select relevant checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.baseline.outputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GROUP: ${{ inputs.group || 'auto' }}
        run: python3 tests/select_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" --group "$GROUP" | tee -a "$GITHUB_OUTPUT"

  layout:
    needs: changes
    if: needs.changes.outputs.layout == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make layout

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu24-i686-${{ hashFiles('Makefile') }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24-i686-${{ hashFiles('Makefile') }}-
      - name: Build and check Windows 95 import baseline
        run: |
          make -j2 check CCACHE=ccache
          make check-build
      - uses: actions/upload-artifact@v4
        with:
          name: explorer95-prototype
          path: build/explorer95.exe

  ui-smoke:
    name: Source UI smoke
    needs: changes
    if: needs.changes.outputs.group != 'none'
    uses: ./.github/workflows/test-ui.yml
    with:
      group: ${{ needs.changes.outputs.group }}

  checks:
    name: Checks
    if: always()
    needs: [changes, layout, build, ui-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
