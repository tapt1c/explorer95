name: Win32 build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build and check Windows 95 import baseline
        run: make check
      - uses: actions/upload-artifact@v4
        with:
          name: explorer95-prototype
          path: build/explorer95.exe
  ui-smoke:
    name: Source UI smoke (Wine 10, x64)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install the validated Wine 10 development runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make python3 git ca-certificates passwd gcc-mingw-w64-x86-64 wine wine64 xvfb xauth
          useradd --create-home --uid 1001 ex95test
          wine --version
      - uses: actions/checkout@v4
      - name: Test source UI in an isolated Wine prefix
        env:
          WINEPREFIX: ${{ runner.temp }}/explorer95-wine
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          mkdir -p "$WINEPREFIX"
          chown -R ex95test:ex95test "$GITHUB_WORKSPACE" "$WINEPREFIX"
          set +e
          runuser -u ex95test -- xvfb-run -a make ui64-smoke WINE=wine CC64=x86_64-w64-mingw32-gcc-win32 > source-ui.log 2>&1
          result=$?
          set -e
          cat source-ui.log
          {
            echo '### Source UI smoke output'
            echo '```text'
            tail -n 100 source-ui.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; lines=Path("source-ui.log").read_text(errors="replace").splitlines(); failures=[line for line in lines if line.startswith(("FAIL:","Shutdown:"))]; message="\n".join(failures[-12:]) if failures else "\n".join(lines[-12:]); print("::error title=Source UI smoke::"+message.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
