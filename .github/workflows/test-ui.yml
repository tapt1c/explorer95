name: Source UI checks
on:
  workflow_call:
    inputs:
      group:
        type: string
        default: full
permissions:
  contents: read
jobs:
  test:
    name: Wine 10 / ${{ inputs.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: debian:13-slim
    steps:
      - name: Install the validated Wine 10 development runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make python3 git ca-certificates passwd gcc-mingw-w64-x86-64 wine wine64 xvfb xauth openbox ccache
          useradd --create-home --uid 1001 ex95test
          wine --version
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/explorer95-ccache
          key: ccache-debian13-x64-${{ hashFiles('Makefile') }}-${{ github.sha }}
          restore-keys: |
            ccache-debian13-x64-${{ hashFiles('Makefile') }}-
      - name: Test source UI in an isolated Wine prefix
        env:
          CCACHE_DIR: ${{ runner.temp }}/explorer95-ccache
          TEST_GROUP: ${{ inputs.group }}
          WINEPREFIX: ${{ runner.temp }}/explorer95-wine
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          mkdir -p "$WINEPREFIX" "$CCACHE_DIR"
          chown -R ex95test:ex95test "$GITHUB_WORKSPACE" "$WINEPREFIX" "$CCACHE_DIR"
          set +e
          runuser -u ex95test -- sh tests/run_ui.sh TEST_GROUP="$TEST_GROUP" CCACHE=ccache WINE=wine CC64=x86_64-w64-mingw32-gcc-win32 > source-ui.log 2>&1
          result=$?
          set -e
          cat source-ui.log
          runuser -u ex95test -- ccache --show-stats
          {
            echo '### Source UI smoke output'
            echo '```text'
            tail -n 100 source-ui.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; lines=Path("source-ui.log").read_text(errors="replace").splitlines(); failures=[line for line in lines if line.startswith(("FAIL:","Shutdown:"))]; message="\n".join(failures[-12:]) if failures else "\n".join(lines[-12:]); print("::error title=Source UI smoke::"+message.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
      - name: Upload source UI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-ui-${{ inputs.group }}
          path: |
            source-ui.log
            build/openbox.log
            build/smoke-failure.bmp
          if-no-files-found: ignore
