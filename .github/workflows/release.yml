name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tags do not also run build.yml. Full UI checks gate publication here.
  validate-ui:
    uses: ./.github/workflows/test-ui.yml
    with:
      group: full
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y gcc-mingw-w64-i686 ccache
      - name: Install pinned native Win95 build tools
        run: |
          python3 tools/install_watcom.py
          echo "WATCOM=$GITHUB_WORKSPACE/.tools/watcom" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ubuntu24-i686-${{ hashFiles('Makefile') }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu24-i686-${{ hashFiles('Makefile') }}-
      - name: Build and check Windows 95 import baseline
        run: make -j2 check CCACHE=ccache
      - name: Check native layout and CI routing
        run: |
          make layout
          make native-check
          python3 -m unittest discover -s tests -p test_select_checks.py
      - name: Package Win32 executable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp build/explorer95.exe release/explorer95.exe
          python3 - <<'PY'
          import os
          from zipfile import ZipFile, ZIP_DEFLATED
          tag = os.environ['RELEASE_TAG']
          with ZipFile(f'release/explorer95-{tag}-win32.zip', 'w', ZIP_DEFLATED) as archive:
              archive.write('build/explorer95.exe', 'explorer95.exe')
              archive.write('README.md', 'README.md')
          PY
          cd release
          sha256sum explorer95.exe *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
  release:
    needs: [validate-ui, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release/
      - name: Publish prerelease and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "Explorer95 $RELEASE_TAG — classic shell prototype" \
            --notes-file .github/release-notes/environment.md \
            release/explorer95.exe release/*.zip release/SHA256SUMS.txt
