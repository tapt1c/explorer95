name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build and check Windows 95 import baseline
        run: make check
      - name: Package Win32 executable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp build/explorer95.exe release/explorer95.exe
          python3 - <<'PY'
          import os
          from zipfile import ZipFile, ZIP_DEFLATED
          tag = os.environ['RELEASE_TAG']
          with ZipFile(f'release/explorer95-{tag}-win32.zip', 'w', ZIP_DEFLATED) as archive:
              archive.write('build/explorer95.exe', 'explorer95.exe')
              archive.write('README.md', 'README.md')
          PY
          cd release
          sha256sum explorer95.exe *.zip > SHA256SUMS.txt
      - name: Publish prerelease and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "Explorer95 $RELEASE_TAG — classic shell prototype" \
            --notes-file .github/release-notes/prototype.md \
            release/explorer95.exe release/*.zip release/SHA256SUMS.txt
